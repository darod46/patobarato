services:
  bot:
    # Built for arm64 by .github/workflows/docker.yml on every push to main.
    # On the server: docker compose pull && docker compose up -d
    image: ghcr.io/darod46/patobarato:latest
    env_file: .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    stdin_open: true
    tty: true
